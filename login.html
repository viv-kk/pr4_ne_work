<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEM System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #333;
            font-weight: 700;
        }
        
        .logo .subtitle {
            color: #666;
            font-size: 0.9rem;
        }
        
        .alert {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <h1>🔒 SIEM System</h1>
            <div class="subtitle">Security Information and Event Management</div>
        </div>
        
        <div id="errorAlert" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span id="errorMessage"></span>
            <button type="button" class="btn-close" onclick="hideError()"></button>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" 
                       placeholder="Enter username" required autocomplete="username">
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" 
                       placeholder="Enter password" required autocomplete="current-password">
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
                    <span id="loginText">Sign In</span>
                    <span id="loginSpinner" class="spinner-border spinner-border-sm" style="display: none;"></span>
                </button>
            </div>
            
            <div class="text-center mt-3">
                <small class="text-muted">
                    Default credentials: admin/admin123 or operator/operator123
                </small>
            </div>
        </form>
    </div>

    <script>
        let authToken = null;
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Показываем спиннер
            document.getElementById('loginText').style.display = 'none';
            document.getElementById('loginSpinner').style.display = 'inline-block';
            document.getElementById('loginBtn').disabled = true;
            
            try {
                // Используем Basic Authentication
                const token = btoa(`${username}:${password}`);
                
                // Тестируем аутентификацию
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Basic ${token}`
                    },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    
                    // Сохраняем токен
                    localStorage.setItem('siem_auth_token', data.token || token);
                    localStorage.setItem('siem_username', username);
                    
                    // Редирект на дашборд
                    window.location.href = '/dashboard';
                } else {
                    showError('Invalid username or password');
                }
            } catch (error) {
                showError('Login failed: ' + error.message);
            } finally {
                // Восстанавливаем кнопку
                document.getElementById('loginText').style.display = 'inline-block';
                document.getElementById('loginSpinner').style.display = 'none';
                document.getElementById('loginBtn').disabled = false;
            }
        });
        
        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorAlert').style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('errorAlert').style.display = 'none';
        }
        
        // Проверяем, если пользователь уже авторизован
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('siem_auth_token')) {
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>
